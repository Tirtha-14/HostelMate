{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="card auth-card">

        <h2>Create Student Account</h2>

        <p class="hint">
            Create your login account first. You will complete your
            HostelMate profile after registration.
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                    minlength="3"
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit">
                Create Student Account
            </button>

        </form>

        <div class="auth-links">

            <p>
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
